name: 測試 SideNeko

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift 核心測試
        run: swift test

  rust:
    runs-on: macos-15
    defaults:
      run:
        working-directory: SigningCore
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust FFI 測試
        run: cargo test --locked --features engine

  full-rust:
    name: 完整簽署與裝置核心
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: 執行完整 Rust 測試
        working-directory: SideNekoFull
        run: ./scripts/test-rust.sh
      - name: 嚴格檢查 Rust 程式碼
        working-directory: SideNekoFull/rust-core
        run: cargo clippy --locked --all-targets -- -D warnings

  bootstrap:
    name: SideNeko bootstrap
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: 測試 Open Minis 安裝流程
        working-directory: SideNekoBootstrap/minis
        run: cargo test --locked
      - name: 測試 rootshell 配對流程
        working-directory: SideNekoBootstrap/rootshell
        run: cargo test --locked

  translations:
    name: 翻譯完整性
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: 檢查翻譯鍵與格式
        working-directory: SideNekoFull
        run: python3 scripts/check_translations.py
