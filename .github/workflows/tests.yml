name: 測試 SideNeko

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift 核心測試
        run: swift test

  rust:
    runs-on: macos-15
    defaults:
      run:
        working-directory: SigningCore
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust FFI 測試
        run: cargo test --locked --features engine
