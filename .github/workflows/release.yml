name: 發布 SideNeko Beta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 取得並核對候選 IPA
        run: |
          git fetch origin release-staging --depth=1
          git show origin/release-staging:SideNeko.ipa > SideNeko.ipa
          echo "52adb75ba7999faf21a04a1af1dbe1f37d42238c7c67bc209df789c99b172dfb  SideNeko.ipa" | sha256sum --check --strict
      - name: 建立 Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SideNeko.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "SideNeko v1.0.3 Beta" \
            --notes "修正 Apple ID 登入時 GrandSlam Client Info 的 macOS 標示。"
      - name: 移除暫存分支
        if: success()
        run: git push origin --delete release-staging
