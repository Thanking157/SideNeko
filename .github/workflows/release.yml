name: 發布 SideNeko Beta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 取得並核對候選 IPA
        run: |
          git fetch origin release-staging --depth=1
          git show origin/release-staging:SideNeko.ipa > SideNeko.ipa
          echo "b773beb79a8ddfc2ed26c3c1eb2f79d9f64a6f0bfc6966d39963677fdb79f787  SideNeko.ipa" | sha256sum --check --strict
      - name: 建立 Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SideNeko.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "SideNeko v1.0.4 Beta" \
            --notes "同步修正 sideneko-bootstrap Apple ID 登入時的 GrandSlam Client Info。"
      - name: 移除暫存分支
        if: success()
        run: git push origin --delete release-staging
