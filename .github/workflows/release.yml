name: 發布 SideNeko Beta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 取得並核對候選 IPA
        run: |
          git fetch origin release-staging --depth=1
          git show origin/release-staging:SideNeko.ipa > SideNeko.ipa
          echo "6b446dfc6b1c0a179c9891a9b00c84100469f8dfd50c8f3b1d3dd06befc33bb6  SideNeko.ipa" | sha256sum --check --strict
      - name: 建立 Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SideNeko.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "SideNeko v1.0.0 Beta" \
            --prerelease \
            --notes-file docs/BETA_RELEASE_NOTES.md
      - name: 移除暫存分支
        if: success()
        run: git push origin --delete release-staging
