name: 發布 SideNeko Beta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 取得並核對候選 IPA
        run: |
          git fetch origin release-staging --depth=1
          git show origin/release-staging:SideNeko.ipa > SideNeko.ipa
          echo "806b3df90104e13c53ff699baab9e5b9b3e9bd3025557c26de9c986de5f28b7e  SideNeko.ipa" | sha256sum --check --strict
      - name: 建立 Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SideNeko.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "SideNeko v1.0.2 Beta" \
            --notes "工具選單與各工具頁面統一改用 SideNeko 橘色 SF Symbols。"
      - name: 移除暫存分支
        if: success()
        run: git push origin --delete release-staging
